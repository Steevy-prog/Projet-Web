services:
  # 🧠 Backend - Laravel
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: laravel_backend
    ports:
      - "8000:8000"  # Laravel dev server
    volumes:
      - ./backend:/var/www/html
    env_file:
      - ./backend/.env
    command: sh -c "php artisan migrate && php artisan serve --host=0.0.0.0 --port=8000"

  # 🎨 Frontend - React + Vite (TypeScript)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vite_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true  # useful for live reload inside Docker
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]